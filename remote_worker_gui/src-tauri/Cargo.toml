[package]
name = "ai-chess-arena-worker"
version = "0.1.2"
description = "AI Chess Arena voluntary remote worker GUI (prototype)"
authors = ["AI Chess Arena contributors"]
edition = "2021"

[lib]
name = "arena_worker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }

reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde_json = "1"
# Already in Cargo.lock transitively; pin the verified 0.10 API for streaming APK SHA-256.
sha2 = "=0.10.9"
# Cryptographically random challenge for anti-replay coordinator idle checks.
getrandom = "=0.2.17"

# Android-only PackageManager inspection of staged APK and installed package.
# Both crates are already present in Cargo.lock.
[target.'cfg(target_os = "android")'.dependencies]
jni = "=0.21.1"
ndk-context = "=0.1.1"
tokio = { version = "1", features = ["time"] }
