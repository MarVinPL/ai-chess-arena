<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Logowanie · AI Chess Arena</title>
<style>
:root{color-scheme:dark;font-family:Inter,system-ui,sans-serif;background:#10151d;color:#e8edf5}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px}
main{width:min(100%,420px);background:#19222e;border:1px solid #344256;border-radius:18px;padding:28px;box-shadow:0 18px 60px #0005}
.mark{font-size:34px;margin-bottom:12px}
h1{font-size:24px;margin:0 0 8px}
p{color:#aab8cb;font-size:14px;line-height:1.55;margin:0 0 24px}
label{display:block;font-size:13px;color:#c7d2e1;margin:16px 0 7px}
input{display:block;width:100%;padding:12px 13px;border:1px solid #3a4a60;border-radius:9px;background:#111923;color:#f2f5fa;font:inherit}
input:focus{outline:2px solid #6c9ee6;outline-offset:1px}
button{width:100%;margin-top:22px;border:0;border-radius:9px;padding:12px;background:#4169a5;color:white;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.55;cursor:wait}
#message{min-height:20px;margin-top:14px;color:#ffaaaa;font-size:13px}
footer{margin-top:22px;color:#75869d;font-size:11px;text-align:center}
</style>
</head>
<body>
<main>
<div class="mark" aria-hidden="true">♟</div>
<h1>AI Chess Arena</h1>
<p>Zaloguj się, aby otworzyć panel turniejowy.</p>
<form id="login-form">
<label for="username">Login</label>
<input id="username" name="username" autocomplete="username" required maxlength="128" autofocus>
<label for="password">Hasło</label>
<input id="password" name="password" type="password" autocomplete="current-password" required maxlength="1024">
<button id="submit" type="submit">Zaloguj się</button>
<div id="message" role="alert" aria-live="polite"></div>
</form>
<footer>Połączenie szyfrowane HTTPS · Sesja wygasa po 8 godzinach</footer>
</main>
<script>
const form=document.getElementById('login-form');
const button=document.getElementById('submit');
const message=document.getElementById('message');
form.addEventListener('submit',async event=>{
  event.preventDefault();
  button.disabled=true;message.textContent='';
  try{
    const response=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:form.username.value,password:form.password.value})});
    const data=await response.json();
    if(!response.ok)throw new Error(data.error||'Nie udało się zalogować.');
    form.reset();window.location.replace('/');
  }catch(error){message.textContent=error.message||'Błąd logowania.';button.disabled=false;}
});
</script>
</body>
</html>
