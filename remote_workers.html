<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Chess Arena — Zdalne komputery</title>
<style>body{font:16px system-ui;background:#101827;color:#edf2fa;margin:0;padding:25px}main{max-width:1100px;margin:auto}a{color:#aabaff}table{width:100%;border-collapse:collapse;background:#1b293c}th,td{text-align:left;padding:12px;border-bottom:1px solid #36455a}th{color:#b8c9e0}table{display:block;overflow-x:auto}p{color:#b8c9e0}.notice{padding:14px;background:#27374d;border-radius:10px}</style></head>
<body><main><a href="/">← Panel Areny</a><h1>Zdalne komputery — statystyki</h1><p>Zakres: cały okres, także po unieważnieniu tokenu. Dane przypisane do identyfikatora komputera.</p>
<p class="notice" id="state" role="status">Pobieranie danych…</p><table><thead><tr><th>Komputer</th><th>Zadania</th><th>Sukcesy</th><th>Błędy</th><th>Przerwane</th><th>Czas obliczeń</th><th>CPU</th><th>GPU</th><th>Ruchy</th><th>Ostatnia aktywność</th></tr></thead><tbody id="rows"></tbody></table></main>
<script>
(async()=>{const state=document.getElementById('state'),rows=document.getElementById('rows');try{const response=await fetch('/api/remote-workers/metrics',{credentials:'same-origin',cache:'no-store'});if(!response.ok)throw Error('HTTP '+response.status);const data=await response.json();if(!Array.isArray(data.workers))throw Error('Nieprawidłowa odpowiedź');state.textContent=data.workers.length?'Zarejestrowane zadania: '+data.workers.reduce((a,w)=>a+w.tasks,0):'Brak zarejestrowanych zadań agentów.';for(const w of data.workers){const tr=document.createElement('tr');for(const value of [w.worker_id,w.tasks,w.successes,w.errors,w.cancelled,(w.duration_ms/3600000).toFixed(2)+' h',(w.cpu_ms/3600000).toFixed(2)+' h',(w.gpu_ms/3600000).toFixed(2)+' h',w.moves,new Date(w.last_activity*1000).toLocaleString('pl-PL')]){const td=document.createElement('td');td.textContent=String(value);tr.appendChild(td)}rows.appendChild(tr)}}catch(_){state.textContent='Nie udało się pobrać statystyk. Sprawdź logowanie i stan serwera.'}})();
</script></body></html>
