name: Worker Android original-key test release (no compilation)

# Explicit operator action on the reviewed main workflow only.
# This only RE-SIGNS one pinned, previously validated PR APK.
on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: worker-android-original-key-test-v0.1.0
  cancel-in-progress: false

jobs:
  sign:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      actions: read
    steps:
      - name: Confirm original APK build provenance
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          run_sha="$(gh api repos/MarVinPL/ai-chess-arena/actions/runs/45018325702 --jq '.head_sha')"
          run_result="$(gh api repos/MarVinPL/ai-chess-arena/actions/runs/45018325702 --jq '.conclusion')"
          test "$run_sha" = '2c8e6660202e8cab032e7533c2b1c9ed507d6a47'
          test "$run_result" = success
      - name: Download pinned APK from original CI run using built-in GitHub CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p input
          gh run download 45018325702 \
            --repo "$GITHUB_REPOSITORY" \
            --name ai-chess-arena-worker-arm64-debug \
            --dir input
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'
      - name: Install free Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager "build-tools;36.0.0"
          test -x "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$ANDROID_HOME/build-tools/36.0.0/aapt"
          test -x "$ANDROID_HOME/build-tools/36.0.0/zipalign"
      - name: Check exact source artifact and Android identity
        shell: bash
        run: |
          set -euo pipefail
          apk=input/ai-chess-arena-worker-arm64-debug.apk
          test -s "$apk"
          (cd input && sha256sum -c SHA256SUMS)
          actual="$(sha256sum "$apk" | cut -d' ' -f1)"
          test "$actual" = fb1a9df1909fbb9f91bf3b881bc798fef98185848b1a04534ffed27bf96d16fe
          tools="$ANDROID_HOME/build-tools/36.0.0"
          "$tools/apksigner" verify "$apk"
          "$tools/zipalign" -c -p 4 "$apk"
          badging="$("$tools/aapt" dump badging "$apk")"
          grep -Fq "package: name='pl.marvin.aichessarena.worker' versionCode='1000' versionName='0.1.0'" <<< "$badging"
          grep -Fq "native-code: 'arm64-v8a'" <<< "$badging"
      - name: Re-sign test APK using the original Android keystore
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.WORKER_ANDROID_DEBUG_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.WORKER_ANDROID_DEBUG_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.WORKER_ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$KEYSTORE_B64"
          test -n "$STORE_PASSWORD"
          test -n "$KEY_PASSWORD"
          mkdir -p dist
          ks="$RUNNER_TEMP/original-worker-test-debug.keystore"
          trap 'rm -f "$ks"' EXIT
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$ks"
          test -s "$ks"
          chmod 600 "$ks"
          # The fingerprint is public, but the original private key must not be logged.
          cert="$("$JAVA_HOME/bin/keytool" -list -v -keystore "$ks" -alias androiddebugkey -storepass:env STORE_PASSWORD | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$cert" = 3f0449ec3a2399ec669cce2dcbd6aa7262671345dfb983c33e2cadf4d1b0da12
          output=dist/ai-chess-arena-worker-v0.1.0-test1-arm64.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign \
            --ks "$ks" --ks-key-alias androiddebugkey \
            --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD \
            --v4-signing-enabled false --out "$output" \
            input/ai-chess-arena-worker-arm64-debug.apk
      - name: Fail closed unless release APK matches the original installed app
        shell: bash
        run: |
          set -euo pipefail
          tools="$ANDROID_HOME/build-tools/36.0.0"
          apk=dist/ai-chess-arena-worker-v0.1.0-test1-arm64.apk
          test -s "$apk"
          "$tools/apksigner" verify --verbose "$apk"
          "$tools/zipalign" -c -p 4 "$apk"
          certificate="$("$tools/apksigner" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
          test "$certificate" = 3f0449ec3a2399ec669cce2dcbd6aa7262671345dfb983c33e2cadf4d1b0da12
          badging="$("$tools/aapt" dump badging "$apk")"
          grep -Fq "package: name='pl.marvin.aichessarena.worker' versionCode='1000' versionName='0.1.0'" <<< "$badging"
          grep -Fq "native-code: 'arm64-v8a'" <<< "$badging"
          (cd dist && sha256sum ai-chess-arena-worker-v0.1.0-test1-arm64.apk > SHA256SUMS)
          cat > dist/PROVENANCE.txt <<'EOF'
          This is a TEST build, NOT a production application release.
          This APK was re-signed from the existing, completed CI artifact; there was no new source compilation.
          Source run: https://github.com/MarVinPL/ai-chess-arena/actions/runs/45018325702
          Source commit: 2c8e6660202e8cab032e7533c2b1c9ed507d6a47 (unmerged stacked Worker branch)
          Source APK SHA-256: fb1a9df1909fbb9f91bf3b881bc798fef98185848b1a04534ffed27bf96d16fe
          Package ID: pl.marvin.aichessarena.worker
          versionCode: 1000
          versionName: 0.1.0
          CPU: arm64-v8a
          Verified certificate SHA-256: 3f0449ec3a2399ec669cce2dcbd6aa7262671345dfb983c33e2cadf4d1b0da12
          Private keystore: never published; only public certificate appears in signed APK.
          This prerelease is deliberately excluded from automatic in-app stable-release discovery.
          EOF
          (cd dist && sha256sum -c SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: worker-v0.1.0-test1-original-key-verified
          path: dist/
          retention-days: 7
          if-no-files-found: error

  publish:
    needs: sign
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified signed APK using built-in GitHub CLI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$GITHUB_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name worker-v0.1.0-test1-original-key-verified \
            --dir dist
      - name: Publish an explicitly marked, immutable test prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && sha256sum -c SHA256SUMS)
          tag=worker-v0.1.0-test.1
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Test release already exists; refusing to overwrite"
            exit 1
          fi
          cat > release-notes.md <<'EOF'
          **Test release — Android ARM64 only. Do not treat as a production release.**

          This is an existing APK built from the unmerged Worker branch and re-signed using the original Android debug signing key. The private key and keystore are **not included**.

          - Android package: `pl.marvin.aichessarena.worker`
          - App version: `0.1.0` (versionCode `1000`); the same as the previously installed test build.
          - Original public certificate SHA-256: `3f0449ec3a2399ec669cce2dcbd6aa7262671345dfb983c33e2cadf4d1b0da12`.
          - Source CI run: https://github.com/MarVinPL/ai-chess-arena/actions/runs/45018325702
          - Source commit: `2c8e6660202e8cab032e7533c2b1c9ed507d6a47` (not merged into main).

          **Testing on Android:** Keep the existing app installed. Download only the APK attached to this prerelease and open it using Android's normal package installer. Do not remove app data or uninstall first. Check whether Android offers **Update** and whether the token/settings remain intact. We cannot confirm on-device installation from CI alone.

          The in-app updater does not install this prerelease, and automatic installation remains disabled pending verified job-idle state. This old **debug** key is for test continuity only, not for production distribution. See `PROVENANCE.txt` and `SHA256SUMS`.
          EOF
          gh release create "$tag" \
            "dist/ai-chess-arena-worker-v0.1.0-test1-arm64.apk" \
            "dist/SHA256SUMS" "dist/PROVENANCE.txt" \
            --repo "$GITHUB_REPOSITORY" --target 2c8e6660202e8cab032e7533c2b1c9ed507d6a47 \
            --prerelease --latest=false \
            --title "AI Chess Arena Worker 0.1.0 — original-key Android test" \
            --notes-file release-notes.md
