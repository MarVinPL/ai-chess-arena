name: Action submodule cache PoC
on:
  push:
    branches: [main]
    paths:
      - '.gitmodules'
      - '.github/actions/setup-java'
      - 'scripts/verify_cached_setup_java.py'
      - '.github/workflows/action-submodule-cache-poc.yml'
  pull_request:
    branches: [main]
    paths:
      - '.gitmodules'
      - '.github/actions/setup-java'
      - 'scripts/verify_cached_setup_java.py'
      - '.github/workflows/action-submodule-cache-poc.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: action-submodule-poc-${{ github.ref }}
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      key: ${{ steps.pin.outputs.key }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - name: Read and validate pinned gitlink
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          pin="$(git ls-tree HEAD -- .github/actions/setup-java | awk '$1=="160000" && $2=="commit" {print $3}')"
          test "$pin" = 'd1374f8ac74474200d16ef8ecee22c7ae7a51880'
          test "$(git config -f .gitmodules --get submodule.setup-java.url)" = 'https://github.com/actions/setup-java.git'
          test "$(git config -f .gitmodules --get submodule.setup-java.path)" = '.github/actions/setup-java'
          echo "key=action-source-v1-${RUNNER_OS}-${RUNNER_ARCH}-setup-java-$pin" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: source
        with:
          path: .github/actions/setup-java
          key: ${{ steps.pin.outputs.key }}
      - name: Fetch only the pinned submodule on cache miss
        if: steps.source.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git -c protocol.file.allow=never submodule update --init --depth 1 -- .github/actions/setup-java
          test "$(git -C .github/actions/setup-java rev-parse HEAD)" = 'd1374f8ac74474200d16ef8ecee22c7ae7a51880'
          test -f .github/actions/setup-java/.git
          rm .github/actions/setup-java/.git
          echo 'ACTION_SOURCE_FETCHED'
      - name: Verify every cached file before use
        run: python3 scripts/verify_cached_setup_java.py
      - uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25
        if: steps.source.outputs.cache-hit != 'true'
        with:
          path: .github/actions/setup-java
          key: ${{ steps.pin.outputs.key }}
      - uses: ./.github/actions/setup-java
        with:
          distribution: temurin
          java-version: '21'
          cache-jdk: false
      - run: java -version && test -x "$JAVA_HOME/bin/java"
  restore:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: source
        with:
          path: .github/actions/setup-java
          key: ${{ needs.prepare.outputs.key }}
          fail-on-cache-miss: true
      - name: Require exact cache hit and verify bytes
        env:
          CACHE_HIT: ${{ steps.source.outputs.cache-hit }}
        run: |
          test "$CACHE_HIT" = true
          python3 scripts/verify_cached_setup_java.py
          echo 'ACTION_SOURCE_CACHE_PROOF_OK'
      - uses: ./.github/actions/setup-java
        with:
          distribution: temurin
          java-version: '21'
          cache-jdk: false
      - run: java -version && test -x "$JAVA_HOME/bin/java"
