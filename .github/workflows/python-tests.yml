name: Python test suite

on:
  pull_request:
    # Temporary integration target for stacked updater PR #197; remove before main.
    branches: [main, feat/issue-194-worker-defaults]
  push:
    branches:
      - "feat/**"
      - "fix/**"
  workflow_dispatch:

# Repository policy requires full commit SHAs for both actions.
permissions:
  contents: read
  actions: read

concurrency:
  group: python-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  select-runner:
    # This job must always start on GitHub's runner; otherwise an offline VPS
    # would queue the fallback decision indefinitely.
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      target: ${{ steps.choose.outputs.target }}
    steps:
      - name: Prefer an idle VPS runner, otherwise use GitHub-hosted
        id: choose
        shell: bash
        env:
          # Optional free fine-grained PAT: repo Administration: read.
          # GITHUB_TOKEN is tried when absent, but may lack that permission.
          RUNNER_STATUS_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TRUSTED_SOURCE: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          target='["ubuntu-latest"]'
          if [[ "$TRUSTED_SOURCE" == "true" ]]; then
            auth_token="${RUNNER_STATUS_TOKEN:-$GH_TOKEN}"
            runners_json="$(curl -fsS --max-time 10 \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              -H "Authorization: Bearer ${auth_token}" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
              2>/dev/null || true)"
            if printf '%s' "$runners_json" | python3 -c '
          import json, sys
          try:
              runners = json.load(sys.stdin)["runners"]
              available = any(
                  item.get("status") == "online"
                  and item.get("busy") is False
                  and {"self-hosted", "Linux"}.issubset({
                      label.get("name") for label in item.get("labels", [])
                  })
                  for item in runners
              )
          except (KeyError, TypeError, ValueError, json.JSONDecodeError):
              available = False
          sys.exit(0 if available else 1)
          '; then
              target='["self-hosted","Linux"]'
            fi
          fi
          printf 'target=%s\n' "$target" >> "$GITHUB_OUTPUT"
          echo "Selected runner: $target"

  tests:
    needs: select-runner
    runs-on: ${{ fromJSON(needs.select-runner.outputs.target) }}
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest

      - name: Run complete test suite
        run: python -m pytest -q tests
