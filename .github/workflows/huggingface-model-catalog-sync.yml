name: Weekly Hugging Face candidate catalog sync

on:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: huggingface-candidate-catalog-sync
  cancel-in-progress: false

jobs:
  discover-and-verify-candidates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Discover public GGUF text-generation candidates and verify tracked sources
        run: python scripts/sync_huggingface_catalog.py

      - name: Open draft PR only when catalog metadata changes
        if: success()
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/huggingface-candidate-catalog
          base: main
          delete-branch: true
          draft: true
          add-paths: manifests/huggingface-candidates.json
          commit-message: 'chore: refresh Hugging Face candidate catalog'
          title: 'chore: refresh Hugging Face candidate catalog'
          body: |
            Automated metadata-only discovery and verification of public Hugging Face GGUF text-generation/conversational repositories.

            - New candidates remain review_required, license_verified=false, technical_readiness=not_evaluated, and admission_status=not_admitted.
            - Existing pinned repositories are checked separately; changed or unavailable sources require human review.
            - Excluded identities and unsafe categories are filtered fail-closed.
            - No license is approved, no model is admitted, and the tournament allowlist is not changed.
            - No model weights are downloaded and no inference is run.

            Refs #63

      - name: Upload catalog sync report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: huggingface-candidate-catalog-${{ github.run_id }}
          path: reports/huggingface-catalog-sync.json
          if-no-files-found: ignore
          retention-days: 90
