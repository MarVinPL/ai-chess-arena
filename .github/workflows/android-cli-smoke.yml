name: Verify Android APK workflow changes

# Unlike the selective app-source workflow, validate SDK tooling changes
# directly by building an unsigned ARM64 APK on untrusted pull requests.
on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/android-worker-apk.yml'
      - '.github/workflows/android-cli-smoke.yml'

permissions:
  contents: read

jobs:
  android:
    uses: ./.github/workflows/android-worker-apk.yml
    permissions:
      contents: read
