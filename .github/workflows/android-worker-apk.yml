name: Android Worker ARM64 APK

on:
  workflow_call:
    secrets:
      WORKER_ANDROID_DEBUG_KEYSTORE_B64:
        required: false
      WORKER_ANDROID_DEBUG_STORE_PASSWORD:
        required: false
      WORKER_ANDROID_DEBUG_KEY_PASSWORD:
        required: false

permissions:
  contents: read

concurrency:
  group: android-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: remote_worker_gui
    env:
      CARGO_BUILD_JOBS: '2'
      GRADLE_OPTS: '-Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx1536m'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remote_worker_gui/package-lock.json
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
        with:
          # Apply the SDK package fix already merged into main as PR #212.
          packages: 'platform-tools'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          # Synced from main PR #220: use stable SDK 36, not nonexistent android-37.
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;27.2.12479018"
          test -s "$ANDROID_HOME/platforms/android-36/android.jar"
          test -d "$ANDROID_HOME/ndk/27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: remote_worker_gui/src-tauri
          key: android-arm64
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Initialize Android project
        run: npx tauri android init --ci
      - name: Generate branded Android launcher resources
        run: |
          # Android resources live in generated Gradle project, not src-tauri/icons.
          # Reuse precisely the same source PNG as Linux and Windows.
          npx tauri icon src-tauri/icons/icon.png
          test -s src-tauri/gen/android/app/src/main/res/mipmap-mdpi/ic_launcher.png
          test -s src-tauri/gen/android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_foreground.png
      - name: Restore historical debug signing key
        # PRs never receive these Secrets; only authorized main pushes do.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        env:
          WORKER_KEYSTORE_B64: ${{ secrets.WORKER_ANDROID_DEBUG_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.WORKER_ANDROID_DEBUG_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.WORKER_ANDROID_DEBUG_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          test -n "$WORKER_KEYSTORE_B64"
          test "$STORE_PASSWORD" = android
          test "$KEY_PASSWORD" = android
          mkdir -p "$HOME/.android"
          printf '%s' "$WORKER_KEYSTORE_B64" | base64 --decode > "$HOME/.android/debug.keystore"
          test -s "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          actual="$("$JAVA_HOME/bin/keytool" -list -v -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass:env STORE_PASSWORD | awk '/SHA256:/ {gsub(":", "", $2); print tolower($2); exit}')"
          test "$actual" = 3f0449ec3a2399ec669cce2dcbd6aa7262671345dfb983c33e2cadf4d1b0da12
      - name: Build debug APK
        run: npx tauri android build --apk --target aarch64 --ci --debug
      - name: Verify APK and record checksum
        shell: bash
        run: |
          set -euo pipefail
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          test -s "$apk"
          signer="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          test -x "$signer"
          "$signer" verify --verbose "$apk"
          if [[ "$GITHUB_EVENT_NAME" == push && "$GITHUB_REF" == refs/heads/main ]]; then
            signed_cert="$("$signer" verify --print-certs "$apk" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -n 1)"
            test "$signed_cert" = 3f0449ec3a2399ec669cce2dcbd6aa7262671345dfb983c33e2cadf4d1b0da12
          fi
          mkdir -p dist
          cp "$apk" dist/ai-chess-arena-worker-arm64-debug.apk
          (cd dist && sha256sum ai-chess-arena-worker-arm64-debug.apk > SHA256SUMS)
      - uses: actions/upload-artifact@v6
        with:
          name: ai-chess-arena-worker-arm64-debug
          path: remote_worker_gui/dist/
          if-no-files-found: error
          retention-days: 7
