name: Android Worker ARM64 APK

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'remote_worker_gui/**'
      - '.github/workflows/android-worker-apk.yml'
  push:
    branches: [main]
    paths:
      - 'remote_worker_gui/**'
      - '.github/workflows/android-worker-apk.yml'

permissions:
  contents: read

concurrency:
  group: android-worker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: remote_worker_gui
    env:
      CARGO_BUILD_JOBS: '2'
      GRADLE_OPTS: '-Dorg.gradle.workers.max=2 -Dorg.gradle.parallel=false -Dorg.gradle.jvmargs=-Xmx1536m'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remote_worker_gui/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-37" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: remote_worker_gui/src-tauri
          key: android-arm64
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Initialize Android project
        run: npx tauri android init --ci
      - name: Build debug APK
        run: npx tauri android build --apk --target aarch64 --ci --debug
      - name: Verify APK and record checksum
        shell: bash
        run: |
          set -euo pipefail
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          test -s "$apk"
          apksigner verify --verbose "$apk"
          sha256sum "$apk" | tee apk-sha256.txt
          mkdir -p dist
          cp "$apk" dist/ai-chess-arena-worker-arm64-debug.apk
          cp apk-sha256.txt dist/
      - uses: actions/upload-artifact@v4
        with:
          name: ai-chess-arena-worker-arm64-debug
          path: remote_worker_gui/dist/
          if-no-files-found: error
          retention-days: 7
