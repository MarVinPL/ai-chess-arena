name: Worker multiplatform CI

on:
  pull_request:
    paths:
      - 'remote_worker_gui/**'
  push:
    branches: [main]
    paths:
      - 'remote_worker_gui/**'

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: worker-platforms-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-24.04
    outputs:
      linux: ${{ steps.select.outputs.linux }}
      windows: ${{ steps.select.outputs.windows }}
      android: ${{ steps.select.outputs.android }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            shared:
              - 'remote_worker_gui/package.json'
              - 'remote_worker_gui/package-lock.json'
              - 'remote_worker_gui/public/**'
              - 'remote_worker_gui/src-tauri/Cargo.toml'
              - 'remote_worker_gui/src-tauri/Cargo.lock'
              - 'remote_worker_gui/src-tauri/src/**'
              - 'remote_worker_gui/src-tauri/capabilities/**'
              - 'remote_worker_gui/src-tauri/tauri.conf.json'
              - 'remote_worker_gui/src-tauri/icons/icon.png'
            linux:
              - 'remote_worker_gui/src-tauri/gen/linux/**'
              - 'remote_worker_gui/src-tauri/linux/**'
              - 'remote_worker_gui/src-tauri/icons/32x32.png'
              - 'remote_worker_gui/src-tauri/icons/128x128.png'
              - 'remote_worker_gui/src-tauri/icons/128x128@2x.png'
            windows:
              - 'remote_worker_gui/src-tauri/gen/windows/**'
              - 'remote_worker_gui/src-tauri/windows/**'
              # Windows resource file only: do not rebuild Linux/Android for ICO-only edits.
              - 'remote_worker_gui/src-tauri/icons/icon.ico'
            android:
              - 'remote_worker_gui/src-tauri/gen/android/**'
              - 'remote_worker_gui/src-tauri/android/**'
      - name: Select platforms
        id: select
        env:
          SHARED: ${{ steps.filter.outputs.shared }}
          LINUX: ${{ steps.filter.outputs.linux }}
          WINDOWS: ${{ steps.filter.outputs.windows }}
          ANDROID: ${{ steps.filter.outputs.android }}
        run: |
          for platform in linux windows android; do
            upper="${platform^^}"
            value="${!upper}"
            if [[ "$SHARED" == true || "$value" == true ]]; then
              echo "$platform=true" >> "$GITHUB_OUTPUT"
            else
              echo "$platform=false" >> "$GITHUB_OUTPUT"
            fi
          done

  desktop:
    needs: changes
    if: needs.changes.outputs.linux == 'true' || needs.changes.outputs.windows == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
          - os: windows-2022
            platform: windows
    runs-on: ${{ matrix.os }}
    timeout-minutes: 70
    defaults:
      run:
        working-directory: remote_worker_gui
    steps:
      - name: Skip unchanged platform
        if: (matrix.platform == 'linux' && needs.changes.outputs.linux != 'true') || (matrix.platform == 'windows' && needs.changes.outputs.windows != 'true')
        # The skipped matrix platform does not run checkout; its app workdir is absent.
        working-directory: .
        run: echo "No relevant changes"
      - uses: actions/checkout@v4
        if: (matrix.platform == 'linux' && needs.changes.outputs.linux == 'true') || (matrix.platform == 'windows' && needs.changes.outputs.windows == 'true')
      - uses: actions/setup-node@v4
        if: (matrix.platform == 'linux' && needs.changes.outputs.linux == 'true') || (matrix.platform == 'windows' && needs.changes.outputs.windows == 'true')
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: remote_worker_gui/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        if: (matrix.platform == 'linux' && needs.changes.outputs.linux == 'true') || (matrix.platform == 'windows' && needs.changes.outputs.windows == 'true')
      - uses: swatinem/rust-cache@v2
        if: (matrix.platform == 'linux' && needs.changes.outputs.linux == 'true') || (matrix.platform == 'windows' && needs.changes.outputs.windows == 'true')
        with:
          workspaces: remote_worker_gui/src-tauri
          key: ${{ matrix.platform }}
      - name: Linux Tauri system libraries
        if: matrix.platform == 'linux' && needs.changes.outputs.linux == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev patchelf
      - name: Build desktop executable (no installer signing)
        if: (matrix.platform == 'linux' && needs.changes.outputs.linux == 'true') || (matrix.platform == 'windows' && needs.changes.outputs.windows == 'true')
        run: |
          npm ci
          npx tauri build --no-bundle
      - name: Stage Linux binary
        if: matrix.platform == 'linux' && needs.changes.outputs.linux == 'true'
        run: |
          mkdir -p dist
          cp src-tauri/target/release/ai-chess-arena-worker dist/ai-chess-arena-worker-linux
          sha256sum dist/* > dist/SHA256SUMS
      - name: Stage Windows binary
        if: matrix.platform == 'windows' && needs.changes.outputs.windows == 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist
          Copy-Item src-tauri/target/release/ai-chess-arena-worker.exe dist/ai-chess-arena-worker-windows.exe
          (Get-FileHash dist/ai-chess-arena-worker-windows.exe -Algorithm SHA256).Hash | Set-Content dist/SHA256.txt
      - uses: actions/upload-artifact@v4
        if: (matrix.platform == 'linux' && needs.changes.outputs.linux == 'true') || (matrix.platform == 'windows' && needs.changes.outputs.windows == 'true')
        with:
          name: worker-${{ matrix.platform }}-unsigned
          path: remote_worker_gui/dist/
          retention-days: 7
          if-no-files-found: error

  android:
    needs: changes
    if: needs.changes.outputs.android == 'true'
    uses: ./.github/workflows/android-worker-apk.yml
    permissions:
      contents: read
