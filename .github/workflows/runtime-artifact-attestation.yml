name: Runtime artifact provenance

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: runtime-artifact-attestation-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-attest:
    name: Build and attest runtime artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # GitHub pauses this job until the runtime-release reviewer approves it.
    environment:
      name: runtime-release
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - name: Checkout protected source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.13'

      - name: Build deterministic runtime artifacts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/runtime-artifacts"
          python tools/build_runtime_worker_bundle.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/runtime-artifacts/runtime_worker"
          python tools/build_runtime_supervisor_bundle.py \
            --repo-root "$GITHUB_WORKSPACE" \
            --output "$RUNNER_TEMP/runtime-artifacts/runtime_supervisor.pyz"
          (
            cd "$RUNNER_TEMP/runtime-artifacts"
            sha256sum runtime_worker runtime_supervisor.pyz | tee SHA256SUMS
          )

      - name: Attest runtime worker
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/runtime-artifacts/runtime_worker

      - name: Attest runtime supervisor
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/runtime-artifacts/runtime_supervisor.pyz
