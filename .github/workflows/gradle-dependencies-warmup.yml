        with:
          targets: aarch64-linux-android
      - name: Initialize Android Worker
        run: |
          npm ci
          # ARM64 is installed above by rust-toolchain; avoid fetching 3 unused Android targets.
          npx tauri android init --ci --skip-targets-install
      - name: Isolate Gradle dependency cache before restore
        shell: bash
        run: |
          set -euo pipefail
          # setup-java can restore its older, broad dependency cache. Do not
          # let that cache or runner-preinstalled modules satisfy this proof.
          test "${GRADLE_USER_HOME:-$HOME/.gradle}" = "$HOME/.gradle"
          test -d "$HOME/.gradle/wrapper/dists"
          quarantine="$(mktemp -d "$RUNNER_TEMP/arena-gradle-quarantine.XXXXXX")"
          # Preserve the literal cache path (part of GitHub's cache version).
          # Quarantine every existing Gradle cache, not the wrapper distribution.
          if test -d "$HOME/.gradle/caches"; then
            mv "$HOME/.gradle/caches" "$quarantine/caches"
          fi
          test ! -e "$HOME/.gradle/caches"
          echo "GRADLE_USER_HOME=$HOME/.gradle" >> "$GITHUB_ENV"
          echo GRADLE_FRESH_CACHE_DIRECTORY_OK
      - name: Fingerprint generated Gradle dependency inputs
        id: modules
        working-directory: .
        run: python3 scripts/gradle_dependency_cache_key.py
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: modules-cache
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ steps.modules.outputs.key }}
          fail-on-cache-miss: true
      - name: Probe changed dependency fingerprint
        id: changed-modules
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          file=remote_worker_gui/src-tauri/gen/android/app/build.gradle.kts
          backup="$(mktemp "$RUNNER_TEMP/arena-gradle-input.XXXXXX")"
          cp "$file" "$backup"
          trap 'cp "$backup" "$file"; rm -f "$backup"' EXIT
          printf '\n// fingerprint-change-test\n' >> "$file"
          python3 scripts/gradle_dependency_cache_key.py
      - uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25
        id: changed-cache
        with:
          path: ~/.gradle/caches/modules-2
          key: ${{ steps.changed-modules.outputs.key }}
          lookup-only: true
      - name: Verify changed fingerprint misses without modifying cache
        shell: bash
        env:
          ORIGINAL: ${{ steps.modules.outputs.key }}
          CHANGED: ${{ steps.changed-modules.outputs.key }}
          HIT: ${{ steps.changed-cache.outputs.cache-hit }}
        run: |
          test "$ORIGINAL" != "$CHANGED"
          test "$HIT" != true
          echo CHANGED_GRADLE_FINGERPRINT_MISS_OK
      - name: Require exact dependency cache hit
        shell: bash
        env:
          MODULES_HIT: ${{ steps.modules-cache.outputs.cache-hit }}
        run: test "$MODULES_HIT" = true
      - name: Verify Gradle offline APK build
        shell: bash
        run: |
          set -euo pipefail
          # Tauri must keep its CLI options server alive during Gradle tasks.
          # Use a temporary Gradle init script to enforce offline resolution
          # without disabling Rust tasks or changing the generated project.
          init_dir="$GRADLE_USER_HOME/init.d"
          mkdir -p "$init_dir"
          init="$(mktemp "$init_dir/arena-offline.XXXXXX.gradle")"
          trap 'rm -f -- "$init"' EXIT
          cat > "$init" <<'GRADLE'
          gradle.startParameter.offline = true
          gradle.startParameter.rerunTasks = true
          println("ARENA_GRADLE_OFFLINE_ENFORCED=" + gradle.startParameter.offline)
          GRADLE
          rm -f src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          npx --no-install tauri android build --apk --target aarch64 --ci --debug 2>&1 | tee "$RUNNER_TEMP/gradle-offline-build.log"
          grep -Fx 'ARENA_GRADLE_OFFLINE_ENFORCED=true' "$RUNNER_TEMP/gradle-offline-build.log"
          test -s src-tauri/gen/android/app/build/outputs/apk/universal/debug/app-universal-debug.apk
          echo GRADLE_OFFLINE_APK_OK
      - name: Inspect cache scope
        shell: bash
        run: |
          du -sh "$GRADLE_USER_HOME/caches/modules-2"
          find "$GRADLE_USER_HOME/caches/modules-2/files-2.1/org.jetbrains.kotlin" -maxdepth 2 -type d -name 2.3.21 | grep -q .
