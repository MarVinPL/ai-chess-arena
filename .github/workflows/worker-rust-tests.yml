name: Worker Rust unit tests
on:
  pull_request:
    branches: [main]
    paths:
      - 'remote_worker_gui/src-tauri/**'
      - '.github/workflows/worker-rust-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rust-unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Install host test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libxdo-dev libssl-dev librsvg2-dev libayatana-appindicator3-dev
      - name: Run Rust library tests (no desktop packaging)
        working-directory: remote_worker_gui/src-tauri
        env:
          CARGO_PROFILE_TEST_DEBUG: '0'
          CARGO_INCREMENTAL: '0'
        run: cargo test --locked --lib
